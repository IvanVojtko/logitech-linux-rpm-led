name: Build DEB/RPM/Arch on Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    env:
      APP_NAME: logitech-rpm-indicator

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version from release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ARCH_VERSION="${VERSION//-/_}"
          if [[ ! "$ARCH_VERSION" =~ ^[[:alnum:]_.]+$ ]]; then
            echo "Invalid Arch package version: $ARCH_VERSION" >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARCH_VERSION=$ARCH_VERSION" >> "$GITHUB_ENV"
          echo "Using VERSION=$VERSION and ARCH_VERSION=$ARCH_VERSION (from tag $TAG)"

      - name: Install packaging tools (fpm + rpm + pacman)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm zip unzip libarchive-tools zstd g++-mingw-w64-x86-64
          sudo gem install --no-document fpm

      - name: Build ETS2 telemetry plugins
        shell: bash
        run: |
          set -euo pipefail
          curl -L https://download.eurotrucksimulator2.com/scs_sdk_1_14.zip -o /tmp/scs_sdk_1_14.zip
          unzip -q /tmp/scs_sdk_1_14.zip -d /tmp/scs_sdk_1_14
          make -C scs-plugin SCS_SDK_DIR=/tmp/scs_sdk_1_14

      - name: Validate desktop assets
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate packaging/io.github.IvanVojtko.LogitechRpmIndicator.desktop
          test -s icons/logitech-rpm-indicator.png
          test -s icons/logitech-rpm-indicator.svg
          grep -qx 'Icon=logitech-rpm-indicator' \
            packaging/io.github.IvanVojtko.LogitechRpmIndicator.desktop

      - name: Prepare package root
        shell: bash
        run: |
          set -euo pipefail

          PKGROOT="pkgroot"
          DIST="dist"
          rm -rf "$PKGROOT" "$DIST"
          mkdir -p "$PKGROOT/usr/share/doc/$APP_NAME" "$DIST"

          [ -f README.md ] && cp -a README.md "$PKGROOT/usr/share/doc/$APP_NAME/" || true
          [ -f LICENSE ] && cp -a LICENSE "$PKGROOT/usr/share/doc/$APP_NAME/" || true

          [ -d scs-plugin ] && cp -a scs-plugin "$PKGROOT/usr/share/doc/$APP_NAME/" || true
          make install DESTDIR="$PWD/$PKGROOT" APPDIR="/opt/$APP_NAME"

      - name: Build .deb, .rpm, and Arch package
        shell: bash
        run: |
          set -euo pipefail
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          DESC="$(head -n 1 README.md 2>/dev/null || echo "$APP_NAME")"
          MAINTAINER="${{ github.actor }}"

          # Runtime dependencies are resolved by the target distro package manager.
          DEB_DEPS=(
            --depends "python3"
            --depends "python3-hid"
            --depends "python3-gi"
            --depends "python3-cairo"
            --depends "python3-gi-cairo"
            --depends "gir1.2-gtk-4.0"
            --depends "gir1.2-adw-1"
          )

          # Fedora runtime dependencies.
          RPM_DEPS=(
            --depends "python3"
            --depends "python3-hid"
            --depends "python3-gobject"
            --depends "python3-cairo"
            --depends "gtk4"
            --depends "libadwaita"
          )

          # Arch Linux runtime dependencies.
          ARCH_DEPS=(
            --depends "python"
            --depends "python-gobject"
            --depends "python-cairo"
            --depends "gtk4"
            --depends "libadwaita"
          )

          CACHE_HOOKS=(
            --after-install packaging/update-desktop-caches.sh
            --after-remove packaging/update-desktop-caches.sh
          )

          # DEB
          fpm -s dir -t deb \
            -n "$APP_NAME" \
            -v "$VERSION" \
            -a amd64 \
            --iteration 1 \
            --license "GPL-3.0-only" \
            --maintainer "$MAINTAINER" \
            --url "$REPO_URL" \
            --description "$DESC" \
            "${DEB_DEPS[@]}" \
            "${CACHE_HOOKS[@]}" \
            -C pkgroot .

          # RPM
          fpm -s dir -t rpm \
            -n "$APP_NAME" \
            -v "$VERSION" \
            -a x86_64 \
            --iteration 1 \
            --license "GPL-3.0-only" \
            --maintainer "$MAINTAINER" \
            --url "$REPO_URL" \
            --description "$DESC" \
            "${RPM_DEPS[@]}" \
            "${CACHE_HOOKS[@]}" \
            -C pkgroot .

          # Arch Linux pacman package
          fpm -s dir -t pacman \
            -n "$APP_NAME" \
            -v "$ARCH_VERSION" \
            -a x86_64 \
            --iteration 1 \
            --license "GPL-3.0-only" \
            --maintainer "$MAINTAINER" \
            --url "$REPO_URL" \
            --description "$DESC" \
            --pacman-compression zstd \
            --pacman-optional-depends "python-hid: HID support via pyhidapi bindings" \
            --pacman-optional-depends "python-hidapi: HID support via cython-hidapi bindings" \
            "${ARCH_DEPS[@]}" \
            "${CACHE_HOOKS[@]}" \
            -C pkgroot .

          mkdir -p dist
          mv ./*.deb dist/
          mv ./*.rpm dist/
          mv ./*.pkg.tar.* dist/

      - name: Verify desktop assets in distribution packages
        shell: bash
        run: |
          set -euo pipefail

          verify_paths() {
            local listing="$1"
            grep -qx 'usr/share/applications/io.github.IvanVojtko.LogitechRpmIndicator.desktop' "$listing"
            grep -qx 'usr/share/icons/hicolor/256x256/apps/logitech-rpm-indicator.png' "$listing"
            grep -qx 'usr/share/icons/hicolor/scalable/apps/logitech-rpm-indicator.svg' "$listing"
          }

          dpkg-deb --contents dist/*.deb | awk '{print $6}' | sed 's|^\./||' > /tmp/deb-files
          rpm -qlp dist/*.rpm | sed 's|^/||' > /tmp/rpm-files
          bsdtar -tf dist/*.pkg.tar.* | sed 's|^\./||' > /tmp/arch-files
          bsdtar -xOf dist/*.pkg.tar.* .PKGINFO > /tmp/arch-pkginfo

          verify_paths /tmp/deb-files
          verify_paths /tmp/rpm-files
          verify_paths /tmp/arch-files
          grep -qx "pkgver = ${ARCH_VERSION}-1" /tmp/arch-pkginfo

      - name: Build source archives (explicit assets)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz -o "dist/${APP_NAME}-${VERSION}-src.tar.gz" "$GITHUB_SHA"
          git archive --format=zip    -o "dist/${APP_NAME}-${VERSION}-src.zip" "$GITHUB_SHA"

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          fail_on_unmatched_files: true
