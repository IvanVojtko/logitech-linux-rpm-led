name: Build DEB/RPM/Arch on Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    env:
      APP_NAME: logitech-rpm-indicator

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version from release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Using VERSION=$VERSION (from tag $TAG)"

      - name: Install packaging tools (fpm + rpm + pacman)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm zip libarchive-tools zstd
          sudo gem install --no-document fpm

      - name: Prepare package root
        shell: bash
        run: |
          set -euo pipefail

          PKGROOT="pkgroot"
          DIST="dist"
          rm -rf "$PKGROOT" "$DIST"
          mkdir -p "$PKGROOT/opt/$APP_NAME" \
                   "$PKGROOT/usr/bin" \
                   "$PKGROOT/usr/share/doc/$APP_NAME" \
                   "$DIST"

          # Copy only what you want packaged (explicit list avoids .venv, .git, etc.)
          cp -a main.py "$PKGROOT/opt/$APP_NAME/"

          [ -f README.md ] && cp -a README.md "$PKGROOT/usr/share/doc/$APP_NAME/" || true
          [ -f LICENSE ] && cp -a LICENSE "$PKGROOT/usr/share/doc/$APP_NAME/" || true

          [ -d games ] && cp -a games "$PKGROOT/opt/$APP_NAME/" || true
          [ -d wheels ] && cp -a wheels "$PKGROOT/opt/$APP_NAME/" || true
          [ -d icons ] && cp -a icons "$PKGROOT/opt/$APP_NAME/" || true
          [ -d scs-plugin ] && cp -a scs-plugin "$PKGROOT/usr/share/doc/$APP_NAME/" || true

          # Runner wrapper (installed on PATH)
          cat > "$PKGROOT/usr/bin/$APP_NAME" <<EOF
          #!/bin/sh
          set -e
          APP_DIR="/opt/$APP_NAME"
          exec /usr/bin/python3 "\$APP_DIR/main.py" "\$@"
          EOF
          chmod 0755 "$PKGROOT/usr/bin/$APP_NAME"

      - name: Build .deb, .rpm, and Arch package
        shell: bash
        run: |
          set -euo pipefail
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          DESC="$(head -n 1 README.md 2>/dev/null || echo "$APP_NAME")"
          MAINTAINER="${{ github.actor }}"

          # Runtime dependencies are resolved by the target distro package manager.
          DEB_DEPS=(
            --depends "python3"
            --depends "python3-hid"
            --depends "python3-gi"
            --depends "python3-cairo"
            --depends "python3-gi-cairo"
            --depends "gir1.2-gtk-4.0"
            --depends "gir1.2-adw-1"
          )

          # Fedora runtime dependencies.
          RPM_DEPS=(
            --depends "python3"
            --depends "python3-hid"
            --depends "python3-gobject"
            --depends "python3-cairo"
            --depends "gtk4"
            --depends "libadwaita"
          )

          # Arch Linux runtime dependencies.
          ARCH_DEPS=(
            --depends "python"
            --depends "python-gobject"
            --depends "python-cairo"
            --depends "gtk4"
            --depends "libadwaita"
          )

          # DEB (arch-independent)
          fpm -s dir -t deb \
            -n "$APP_NAME" \
            -v "$VERSION" \
            -a all \
            --iteration 1 \
            --license "GPL-3.0-only" \
            --maintainer "$MAINTAINER" \
            --url "$REPO_URL" \
            --description "$DESC" \
            "${DEB_DEPS[@]}" \
            -C pkgroot .

          # RPM (arch-independent)
          fpm -s dir -t rpm \
            -n "$APP_NAME" \
            -v "$VERSION" \
            -a noarch \
            --iteration 1 \
            --license "GPL-3.0-only" \
            --maintainer "$MAINTAINER" \
            --url "$REPO_URL" \
            --description "$DESC" \
            "${RPM_DEPS[@]}" \
            -C pkgroot .

          # Arch Linux pacman package (arch-independent)
          fpm -s dir -t pacman \
            -n "$APP_NAME" \
            -v "$VERSION" \
            -a all \
            --iteration 1 \
            --license "GPL-3.0-only" \
            --maintainer "$MAINTAINER" \
            --url "$REPO_URL" \
            --description "$DESC" \
            --pacman-compression zstd \
            --pacman-optional-depends "python-hid: HID support via pyhidapi bindings" \
            --pacman-optional-depends "python-hidapi: HID support via cython-hidapi bindings" \
            "${ARCH_DEPS[@]}" \
            -C pkgroot .

          mkdir -p dist
          mv ./*.deb dist/
          mv ./*.rpm dist/
          mv ./*.pkg.tar.* dist/

      - name: Build source archives (explicit assets)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz -o "dist/${APP_NAME}-${VERSION}-src.tar.gz" "$GITHUB_SHA"
          git archive --format=zip    -o "dist/${APP_NAME}-${VERSION}-src.zip" "$GITHUB_SHA"

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          fail_on_unmatched_files: true
